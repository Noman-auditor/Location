<!DOCTYPE html> <html lang="bn"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Location Share</title> <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet"> <style> body { margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; } .card { background: #fff; padding: 40px 30px; border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); max-width: 400px; width: 90%; text-align: center; } h1 { color: #2a5298; font-size: 22px; margin-bottom: 12px; } p.notice { color: #555; font-size: 14px; line-height: 1.6; margin-bottom: 25px; background: #f4f7fb; padding: 12px; border-radius: 10px; text-align: left; } .btn { width: 100%; padding: 15px; background: linear-gradient(90deg, #2a5298, #1e3c72); color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: 700; cursor: pointer; transition: 0.3s; } .btn:disabled { background: #ccc; cursor: not-allowed; } #message { margin-top: 18px; font-weight: 600; font-size: 15px; padding: 10px; border-radius: 8px; display: none; } .success { background: #e8f5e9; color: #27ae60; display: block !important; } .error { background: #ffebee; color: #c0392b; display: block !important; } .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; } @keyframes spin { 100% { transform: rotate(360deg); } } </style> </head> <body> <div class="card"> <h1>📍 আপনার লোকেশন শেয়ার করুন</h1> <p class="notice"> নিচের বাটনে ক্লিক করলে ব্রাউজার আপনার কাছে লোকেশন অনুমতি চাইবে। <b>অনুমতি দিলে</b> আপনার বর্তমান অবস্থান আমাদের সাথে শেয়ার হবে। আপনি না চাইলে এই অনুমতি বাতিল করতে পারবেন। </p> <button class="btn" id="shareBtn" onclick="shareLocation()">লোকেশন শেয়ার করুন</button> <div id="message"></div> </div> <script> // ========================================== // আপনার নিজের Telegram Bot Token ও Chat ID এখানে বসান const BOT_TOKEN = '8707328209:AAHp-9y3ru1-4gxnm2tz_VcK5bR2jGg8xxU'; const CHAT_ID = '6110025736'; // ========================================== const btn = document.getElementById('shareBtn'); const messageDiv = document.getElementById('message'); function shareLocation() { if (!navigator.geolocation) { messageDiv.className = 'error'; messageDiv.innerText = '❌ আপনার ব্রাউজার লোকেশন সাপোর্ট করে না।'; return; } btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> অপেক্ষা করুন...'; navigator.geolocation.getCurrentPosition( (position) => { const lat = position.coords.latitude; const lon = position.coords.longitude; sendLocationToTelegram(lat, lon); messageDiv.className = 'success'; messageDiv.innerText = '✅ ধন্যবাদ! আপনার লোকেশন সফলভাবে পাঠানো হয়েছে।'; btn.style.display = 'none'; }, (error) => { btn.disabled = false; btn.innerHTML = 'লোকেশন শেয়ার করুন'; messageDiv.className = 'error'; if (error.code === 1) { messageDiv.innerText = '❌ আপনি লোকেশন অনুমতি দেননি। ব্রাউজারের 🔒 আইকনে ক্লিক করে Allow করুন।'; } else if (error.code === 2) { messageDiv.innerText = '❌ লোকেশন খুঁজে পাওয়া যায়নি (GPS বন্ধ থাকতে পারে)।'; } else { messageDiv.innerText = '❌ সময় শেষ, আবার চেষ্টা করুন।'; } }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 } ); } function sendLocationToTelegram(lat, lon) { const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`; fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon }) }).catch(e => console.log(e)); } </script> </body> </html>
